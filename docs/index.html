<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoxOne Installer</title>
  <link rel="stylesheet" href="./style.css?v=3" />
</head>

<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div>
          <p class="eyebrow">INSTALATOR FIRMWARE</p>
          <img class="brand-logo" src="./assets/logo.svg" alt="VoxOne" width="207" height="50" />
        </div>
      </div>
      <div class="identity">
        <div class="identity-badges">
          <div class="badge">Wersja 1.0.0</div>
        </div>
      </div>
    </header>

    <nav class="tabs" aria-label="Główna nawigacja">
      <a href="#installer" aria-current="page">Instalator</a>
      <a href="#instruction">Instrukcja</a>
      <a href="#info">Info</a>
    </nav>

    <main id="installer">
      <section id="profiles-section">
        <h2>1. Wybierz płytkę</h2>
        <div id="profiles"></div>
      </section>

      <section id="actions-section">
        <h2>2. Podłącz i wgraj</h2>
        <div class="buttons">
          <button id="btn-connect" disabled>Połącz</button>
          <button id="btn-flash" disabled>Wgraj firmware</button>
        </div>
        <p id="status" class="status">Wybierz profil z listy powyżej.</p>
      </section>

      <section id="log-section">
        <h2>Log</h2>
        <pre id="log"></pre>
      </section>
    </main>

    <footer class="site-footer">
      <span>VoxOne © 2026 PMW</span>
      <a href="mailto:pmw.voxone@gmail.com">Support: pmw.voxone@gmail.com</a>
    </footer>
  </div>

  <script type="module" src="./app.js?v=2"></script>
</body>

</html>
